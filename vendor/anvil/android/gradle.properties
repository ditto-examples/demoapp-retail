org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# catalog-expressive compiles against 37.0 (material3 1.5.0-alpha26), newer than
# AGP 8.13.2's tested maximum (36.1). This suppression must live at the root:
# AGP's check runs before subproject gradle.properties files are read.
android.suppressUnsupportedCompileSdk=37.0

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Vendored override (vendor_anvil.sh): run on the consumer app's modern
# AGP 9 / Kotlin 2.4 toolchain — opt out of AGP 9's built-in Kotlin and the
# new DSL (these modules apply their own Kotlin Gradle Plugin).
android.builtInKotlin=false
android.newDsl=false
