[versions]
# Modern toolchain (PLAN.md §4.4). Proven envelope: mflix ships AGP 9.3.1 /
# Kotlin 2.4.10 / BOM 2026.08.00; ditto-edge-studio ships Ditto 5.1.0 on AGP
# 9.2.1 / Kotlin 2.3.21 / compileSdk 37.
agp = "9.3.1"
kotlin = "2.4.10"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"

# Ditto SDK + official tools (PLAN §1.3 baselines; mflix ships these).
ditto = { require = "[5.0.1,6.0.0)", prefer = "5.1.0" }
dittoTools = { require = "[6.0.0,7.0.0)", prefer = "6.0.0" }

# Serialization for models + the bundled benchmark catalog.
kotlinxSerialization = "1.9.0"
coroutines = "1.10.2"
lifecycle = "2.10.0"
# Navigation 3 + adaptive navigation suite (PLAN §4.3: rail on tablets).
navigation3 = "1.0.0"
material3Adaptive = "1.4.0"
materialIconsExtended = "1.7.8"
junit = "4.13.2"

# Vendored Anvil (see vendor/anvil/COMMIT). Version matches the included
# build's publication so composite-build substitution can trigger.
anvil = "0.1.0-SNAPSHOT"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "material3Adaptive" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
ditto-kotlin = { group = "com.ditto", name = "ditto-kotlin", version.ref = "ditto" }
ditto-tools-android = { group = "com.ditto", name = "ditto-tools-android", version.ref = "dittoTools" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
anvil-material3 = { group = "live.ditto.anvil", name = "anvil-material3", version.ref = "anvil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
