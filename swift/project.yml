name: ZavaRetail
options:
  bundleIdPrefix: live.ditto.zava
  deploymentTarget: "26.0"

packages:
  # Vendored Anvil design system (unpublished upstream — see vendor/anvil/COMMIT).
  # Swap for the published package once Anvil ships to a registry.
  Anvil:
    path: ../vendor/anvil/swift/Anvil
  DittoSwiftPackage:
    url: https://github.com/getditto/DittoSwiftPackage
    exactVersion: 5.1.0
  DittoSwiftTools:
    url: https://github.com/getditto/DittoSwiftTools
    exactVersion: 10.0.0

targets:
  ZavaRetail:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ZavaRetail
        excludes:
          - Info.plist
      - path: Generated
        optional: true
      # Anvil fonts (the Swift port does not bundle them — registered via UIAppFonts).
      - path: ../vendor/anvil/fonts/inter_regular.ttf
        buildPhase: resources
      - path: ../vendor/anvil/fonts/ibm_plex_mono_regular.ttf
        buildPhase: resources
      - path: ../vendor/anvil/fonts/ibm_plex_mono_bold.ttf
        buildPhase: resources
      - path: ../vendor/anvil/fonts/ibm_plex_mono_italic.ttf
        buildPhase: resources
      # The 72-query benchmark catalog for the Query Runner tab.
      - path: ../shared/benchmarks.json
        buildPhase: resources
    dependencies:
      - package: Anvil
      # DittoSwift ships as a dynamic XCFramework. iOS embeds it implicitly;
      # macOS needs the post-build embed script below (XcodeGen's package
      # embed: true mis-resolves the copy source for binary packages).
      - package: DittoSwiftPackage
        product: DittoSwift
      - package: DittoSwiftTools
        product: DittoAllToolsMenu
    postBuildScripts:
      - name: Embed DittoSwift.framework (macOS)
        shell: /bin/sh
        script: |
          # Without this the macOS app crashes at launch: dyld can't find
          # @rpath/DittoSwift.framework (the XCFramework is dynamic).
          if [ "$PLATFORM_NAME" = "macosx" ]; then
            SRC="$BUILD_DIR/../../SourcePackages/artifacts/dittoswiftpackage/DittoSwift/DittoSwift.xcframework/macos-arm64/DittoSwift.framework"
            DST_DIR="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
            mkdir -p "$DST_DIR"
            rm -rf "$DST_DIR/DittoSwift.framework"
            cp -R "$SRC" "$DST_DIR/"
            # Ad-hoc sign so the framework loads from a locally-signed app.
            codesign --force --sign - --timestamp=none "$DST_DIR/DittoSwift.framework" 2>/dev/null || true
          fi
    preBuildScripts:
      - name: Generate Env.swift
        shell: /bin/sh
        script: "\"$SRCROOT/buildEnv.sh\" \"$SRCROOT/../.env\" \"$SRCROOT/Generated\"\n"
        inputFiles:
          - $(SRCROOT)/buildEnv.sh
          - $(SRCROOT)/../.env
        outputFiles:
          - $(SRCROOT)/Generated/Env.swift
      # Fatal lint gate (zero-violations baseline — the codebase is new, so
      # warnings are work items). DISABLED RULES/notes live in .swiftlint.yml.
      - name: SwiftLint
        shell: /bin/sh
        script: |
          if command -v swiftlint >/dev/null; then
            cd "$SRCROOT" && swiftlint lint --config .swiftlint.yml
          else
            echo "error: SwiftLint is required (brew install swiftlint)" && exit 1
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.ditto.zava
        PRODUCT_NAME: ZavaRetail
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        # Multiplatform: iOS/iPadOS + macOS, one target (ditto-edge-studio pattern).
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        # iOS-style default (@executable_path/Frameworks) isn't enough on
        # macOS — dyld needs @executable_path/../Frameworks for the embedded
        # DittoSwift.framework (see the Embed post-build script).
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        # Swift 6 language mode, full strict concurrency (PLAN §4.4).
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        INFOPLIST_FILE: ZavaRetail/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # App icon: ZavaRetail/Assets.xcassets/AppIcon.appiconset (regenerate
        # the artwork with `make icon`).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # NO because the SwiftLint build phase reads the whole source tree
        # (sandbox grants only declared paths). The Env phase keeps declared
        # input/output files, so it stays sandbox-correct regardless.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  ZavaRetailTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ZavaRetailTests
      - path: ../shared/benchmarks.json
        buildPhase: resources
    dependencies:
      - target: ZavaRetail
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  ZavaRetailUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ZavaRetailUITests
    dependencies:
      - target: ZavaRetail
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ZavaRetail:
    build:
      targets:
        ZavaRetail: all
    test:
      gatherCoverageData: true
      targets:
        - ZavaRetailTests
        - ZavaRetailUITests
