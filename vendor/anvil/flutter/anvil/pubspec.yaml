name: anvil
description: >-
  Ditto's design system (Anvil) as a Material 3 theme for Flutter: colors,
  typography, and branding in light, dark, and both high-contrast tiers.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/inter_regular.ttf
          weight: 400
        - asset: fonts/inter_medium.ttf
          weight: 500
        - asset: fonts/inter_semibold.ttf
          weight: 600
        - asset: fonts/inter_bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: fonts/ibm_plex_mono_regular.ttf
          weight: 400
        - asset: fonts/ibm_plex_mono_italic.ttf
          weight: 400
          style: italic
        - asset: fonts/ibm_plex_mono_bold.ttf
          weight: 700
